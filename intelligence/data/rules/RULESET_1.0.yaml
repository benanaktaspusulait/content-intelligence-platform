# Pompom Creative Quality Engine — Ruleset 1.0
# Initial critical blocker rules derived from FAIL_001, FAIL_002, FAIL_003

version: "1.0"
created: "2026-09-09"
description: "Initial ruleset focusing on critical structural failures: static state dominance, repetitive actions, and repetitive cycles"

rules:
  # ========================================
  # CONCEPT STRENGTH FAMILY
  # ========================================
  
  - id: CONCEPT_006
    name: Consequence Capacity
    family: concept_strength
    severity: BLOCKER
    version: "1.0"
    
    description: |
      Before writing a 15-second prompt, verify that the core mechanic
      can naturally generate at least 4 visually distinct consequences.
      
      If it cannot, reject the concept.
      
      Do NOT stretch a two-beat teaching contrast into 15 seconds.
    
    measurement:
      type: count
      field: beats[].isNewConsequence
      aggregation: count_true
    
    threshold:
      minimum: 4
      recommended: 5
    
    evaluation:
      - if: consequence_count < 4
        result: FAIL
        severity: BLOCKER
        message: "Only {consequence_count} distinct visual consequences detected. Minimum: 4. Core mechanic insufficient for 15 seconds."
      
      - if: consequence_count == 4
        result: PASS
        severity: WARNING
        message: "Exactly 4 consequences. Consider adding 1-2 more for stronger engagement."
      
      - if: consequence_count >= 5
        result: PASS
        severity: PASS
        message: "Sufficient consequence variety: {consequence_count} distinct consequences."
    
    examples:
      fail:
        - concept: "slippery floor vs rough mat"
          consequences: ["slide", "stop on mat"]
          count: 2
          reason: "Two-state contrast only generates 2 consequences"
      
      pass:
        - concept: "door that opens when character leaves"
          consequences: ["door closes", "won't open when pulled", "opens when character turns away", "character catches it opening", "final reveal"]
          count: 5
          reason: "Multiple escalating consequences from single mechanic"
    
    learned_from:
      - FAIL_001
      - FAIL_003

  # ========================================
  # VISUAL NOVELTY FAMILY
  # ========================================
  
  - id: BEAT_004
    name: Static State Dominance
    family: visual_novelty
    severity: CRITICAL
    version: "1.0"
    
    description: |
      No single visual state may occupy more than approximately
      25–30% of the entire video unless meaningful new physical
      consequences occur within that state.
      
      Different dialogue or tiny movements do NOT count
      as different visual beats.
    
    measurement:
      type: duration_percentage
      field: beats[].visualStateId
      aggregation: group_and_sum_duration
    
    threshold:
      maximum_percentage: 30
      critical_percentage: 35
      warning_percentage: 25
    
    evaluation:
      - if: any_state_percentage > 35
        result: FAIL
        severity: CRITICAL
        message: "Visual state '{state_id}' occupies {percentage}% of video. Maximum: 30%. Video feels static."
      
      - if: any_state_percentage > 30 and any_state_percentage <= 35
        result: FAIL
        severity: CRITICAL
        message: "Visual state '{state_id}' occupies {percentage}% of video. Maximum: 30%."
      
      - if: any_state_percentage > 25 and any_state_percentage <= 30
        result: PASS
        severity: WARNING
        message: "Visual state '{state_id}' occupies {percentage}% of video. Consider adding variation."
      
      - if: any_state_percentage <= 25
        result: PASS
        severity: PASS
        message: "Good visual state distribution. Max state: {percentage}%."
    
    implementation_notes: |
      1. Group consecutive beats by visualStateId
      2. Sum duration for each unique visualStateId
      3. Calculate percentage: (state_duration / total_duration) * 100
      4. Find maximum percentage
      5. Apply threshold evaluation
    
    examples:
      fail:
        case: FAIL_001_KIKO
        states:
          on_rough_mat: 6.3s (42%)
          on_slippery_floor: 5.4s (36%)
        reason: "Character stands on mat for 42% of video with minimal consequence variation"
      
      pass:
        states:
          sliding: 3.2s (21%)
          testing_surface: 2.8s (19%)
          transition: 2.5s (17%)
          escalation: 3.5s (23%)
        reason: "Well-distributed visual states, no single state dominates"
    
    learned_from:
      - FAIL_001

  - id: REPETITION_002
    name: Visual Beat Repetition
    family: visual_novelty
    severity: CRITICAL
    version: "1.0"
    
    description: |
      The same physical action should not repeat more than twice
      unless each iteration introduces a materially different consequence.
      
      Emotional variation (confused → understanding → frustrated)
      without physical consequence change is insufficient.
    
    measurement:
      type: action_frequency
      field: beats[].action
      aggregation: count_similar_actions
    
    threshold:
      maximum_repetitions: 2
      requires_consequence_escalation: true
    
    evaluation:
      - if: any_action_count > 3
        result: FAIL
        severity: CRITICAL
        message: "Action '{action}' repeats {count} times. Maximum: 2-3 with escalation. Video feels repetitive."
      
      - if: any_action_count == 3 and not all_have_different_consequences
        result: FAIL
        severity: CRITICAL
        message: "Action '{action}' repeats 3 times without distinct consequences. Add variation or new obstacles."
      
      - if: any_action_count == 3 and all_have_different_consequences
        result: PASS
        severity: WARNING
        message: "Action '{action}' appears 3 times but with escalating consequences. Consider if more variation possible."
      
      - if: any_action_count <= 2
        result: PASS
        severity: PASS
        message: "Good action variety. Max repetition: {count}."
    
    implementation_notes: |
      1. Normalize action descriptions (e.g., "opens book" == "opens it" == "Opa opens book")
      2. Count frequency of each normalized action
      3. For actions appearing 3+ times, check if beats have different consequenceType
      4. Apply threshold evaluation
    
    examples:
      fail:
        case: FAIL_002_OPA
        actions:
          open_book: 3 times (beats 1, 3, 4)
          book_closes: 2 times (beats 0, 2)
        reason: "Same open/close cycle repeats without new physical elements"
      
      pass:
        actions:
          open_book: 1 time
          hold_book_with_bookmark: 1 time
          tape_book_edges: 1 time
          book_ejects_tape: 1 time
        reason: "Each attempt introduces new physical element"
    
    learned_from:
      - FAIL_002

  - id: REPETITION_003
    name: Cycle Repetition Limit
    family: visual_novelty
    severity: CRITICAL
    version: "1.0"
    
    description: |
      A cause-effect cycle (action → consequence → reset) should not
      repeat more than twice unless each iteration introduces a NEW
      physical element, obstacle, or escalation.
      
      Example cycle: sharpen → draw → blunt → (reset to sharpen)
      
      Cosmetic variations (stroke pattern, sharpen duration) do not
      count as structural escalation.
    
    measurement:
      type: cycle_detection
      field: beats[].cycleGroup
      aggregation: count_cycle_iterations
    
    threshold:
      maximum_cycle_iterations: 2
      requires_structural_escalation: true
    
    evaluation:
      - if: any_cycle_count > 3
        result: FAIL
        severity: CRITICAL
        message: "Cycle '{cycle_id}' repeats {count} times. Maximum: 2-3 with escalation. Add new obstacles or consequences."
      
      - if: any_cycle_count == 3 and not has_structural_escalation
        result: FAIL
        severity: CRITICAL
        message: "Cycle '{cycle_id}' repeats 3 times with only cosmetic variation. Introduce new physical elements."
      
      - if: any_cycle_count == 3 and has_structural_escalation
        result: PASS
        severity: WARNING
        message: "Cycle '{cycle_id}' repeats 3 times with escalation. Acceptable but consider more variety."
      
      - if: any_cycle_count <= 2
        result: PASS
        severity: PASS
        message: "Good cycle variety. Max iterations: {count}."
    
    implementation_notes: |
      1. Detect cycles by grouping beats with same cycleGroup identifier
      2. Count iterations of each cycle
      3. For cycles appearing 3+ times, check if new props/obstacles appear
      4. Cosmetic changes (different drawing pattern) ≠ structural escalation
      5. Structural escalation = new prop, break, obstacle, character reaction with consequence
    
    examples:
      fail:
        case: FAIL_003_ARDA
        cycle: sharpen_draw_blunt
        iterations:
          - iter_1: "fast strokes → blunt → sharpen"
          - iter_2: "zigzag strokes → blunt → careful sharpen"
          - iter_3: "clean line → stays sharp (minor win) → extra sharpen"
        reason: "Same cycle with only cosmetic variations (stroke pattern, sharpen duration)"
      
      pass:
        cycle: sharpen_draw
        iterations:
          - iter_1: "sharpen → draw → blunt"
          - iter_2: "sharpen harder → paper tears"
          - iter_3: "new paper → gentle sharpen → pencil breaks"
        reason: "Each iteration introduces new physical consequence (tear, break)"
    
    learned_from:
      - FAIL_003

  - id: NOVELTY_001
    name: Novelty Timeline Distribution
    family: visual_novelty
    severity: WARNING
    version: "1.0"
    
    description: |
      New consequences should be distributed across the timeline,
      not clustered at the beginning or end.
      
      No gap longer than 4.5 seconds should pass without a new
      visually distinct consequence appearing.
    
    measurement:
      type: gap_detection
      field: beats[].isNewConsequence
      aggregation: find_longest_gap
    
    threshold:
      maximum_gap_seconds: 4.5
      critical_gap_seconds: 6.0
    
    evaluation:
      - if: longest_gap > 6.0
        result: FAIL
        severity: CRITICAL
        message: "Gap of {gap}s between new consequences (at {start}s-{end}s). Video likely loses viewer attention."
      
      - if: longest_gap > 4.5 and longest_gap <= 6.0
        result: PASS
        severity: WARNING
        message: "Gap of {gap}s between new consequences (at {start}s-{end}s). Consider adding intermediate beat."
      
      - if: longest_gap <= 4.5
        result: PASS
        severity: PASS
        message: "Good novelty distribution. Max gap: {gap}s."
    
    learned_from:
      - FAIL_001
      - FAIL_002
      - FAIL_003

  # ========================================
  # PROGRESSION FAMILY
  # ========================================
  
  - id: PROGRESSION_005
    name: Consequence Novelty Timeline
    family: progression
    severity: WARNING
    version: "1.0"
    
    description: |
      No more than 50% of the video should pass without new
      visually distinct physical consequences appearing.
      
      If > 65% of video shows only pattern variations of the same
      core action, flag as CRITICAL.
    
    measurement:
      type: percentage_calculation
      field: beats[].isNewConsequence
      aggregation: calculate_static_pattern_percentage
    
    threshold:
      maximum_static_percentage: 50
      critical_static_percentage: 65
    
    evaluation:
      - if: static_percentage > 65
        result: FAIL
        severity: CRITICAL
        message: "{static_percentage}% of video (0-{end_time}s) shows repetitive pattern without new consequences. Maximum: 50%."
      
      - if: static_percentage > 50 and static_percentage <= 65
        result: PASS
        severity: WARNING
        message: "{static_percentage}% of video shows pattern repetition. Consider adding new elements by {mid_point}s."
      
      - if: static_percentage <= 50
        result: PASS
        severity: PASS
        message: "Good novelty timeline. Static pattern: {static_percentage}%."
    
    learned_from:
      - FAIL_001
      - FAIL_003

  # ========================================
  # ESCALATION FAMILY
  # ========================================
  
  - id: ESCALATION_004
    name: Delayed Payoff
    family: escalation
    severity: WARNING
    version: "1.0"
    
    description: |
      The final major escalation should not appear after 80% of the video
      (12 seconds in a 15-second video) unless the middle contains
      strong intermediate escalations.
      
      Late payoffs risk losing viewer attention before the peak.
    
    measurement:
      type: timestamp_check
      field: finalPayoff.startsAt
      aggregation: compare_to_duration
    
    threshold:
      warning_percentage: 75
      critical_percentage: 80
    
    evaluation:
      - if: payoff_percentage > 80 and middle_has_weak_escalation
        result: FAIL
        severity: CRITICAL
        message: "Final payoff at {payoff_time}s ({payoff_percentage}%). Repetitive middle + late payoff risks early exits."
      
      - if: payoff_percentage > 80 and middle_has_strong_escalation
        result: PASS
        severity: WARNING
        message: "Final payoff at {payoff_time}s ({payoff_percentage}%). Late but middle is strong."
      
      - if: payoff_percentage > 75 and payoff_percentage <= 80
        result: PASS
        severity: WARNING
        message: "Final payoff at {payoff_time}s. Consider moving earlier for stronger retention."
      
      - if: payoff_percentage <= 75
        result: PASS
        severity: PASS
        message: "Good payoff timing at {payoff_time}s."
    
    implementation_notes: |
      payoff_percentage = (finalPayoff.startsAt / metadata.duration) * 100
      
      middle_has_weak_escalation = true if:
        - beats 4s-11s have < 2 new consequences
        - OR intensity variance in middle < 2
    
    learned_from:
      - FAIL_003

  # ========================================
  # FINAL PAYOFF FAMILY
  # ========================================
  
  - id: PAYOFF_001
    name: Not Repeat of Opening
    family: final_payoff
    severity: CRITICAL
    version: "1.0"
    
    description: |
      The final beat must not be identical or nearly identical
      to the opening beat.
      
      A callback is acceptable if it's BIGGER or has a TWIST.
      A simple repeat signals lazy structure.
    
    measurement:
      type: boolean_check
      field: finalPayoff.isRepeatOfOpening
      aggregation: direct_check
    
    threshold:
      is_repeat: false
    
    evaluation:
      - if: is_repeat == true
        result: FAIL
        severity: CRITICAL
        message: "Final beat repeats opening action without escalation. Payoff must be unique or bigger."
      
      - if: is_repeat == false
        result: PASS
        severity: PASS
        message: "Final payoff is distinct from opening."
    
    examples:
      fail:
        case: FAIL_001_KIKO
        opening: "slides on slippery floor, arms out, says 'SLIPPERY!'"
        final: "slides on slippery floor, arms out, says 'SLIPPERY!'"
        reason: "Nearly identical visual and dialogue"
      
      pass:
        opening: "slides on slippery floor"
        final: "slides into tall stack of objects, creates domino effect"
        reason: "Callback to slide but with bigger consequence"
    
    learned_from:
      - FAIL_001

  # ========================================
  # AI PRODUCIBILITY FAMILY
  # ========================================
  
  - id: PRODUCIBILITY_001
    name: Very High Complexity Block
    family: ai_producibility
    severity: BLOCKER
    version: "1.0"
    
    description: |
      Prompts marked as "very_high" complexity should not proceed
      to render without human review and risk acceptance.
      
      Very high complexity typically means 4+ simultaneous high-risk
      operations or untested novel requirements.
    
    measurement:
      type: enum_check
      field: producibility.overallComplexity
      aggregation: direct_check
    
    threshold:
      blocked_value: "very_high"
    
    evaluation:
      - if: complexity == "very_high"
        result: FAIL
        severity: BLOCKER
        message: "Overall complexity: very_high. High risk of render failure. Simplify or accept risk."
      
      - if: complexity == "high"
        result: PASS
        severity: WARNING
        message: "Overall complexity: high. Render uncertain. Consider simplifications."
      
      - if: complexity == "medium" or complexity == "low"
        result: PASS
        severity: PASS
        message: "Acceptable complexity: {complexity}."

  # ========================================
  # CONSISTENCY FAMILY
  # ========================================
  
  - id: CONSISTENCY_001
    name: Physics Rule Consistency
    family: consistency
    severity: WARNING
    version: "1.0"
    
    description: |
      The physical rule established in the hook should remain
      consistent throughout the video unless the concept explicitly
      involves rule-breaking as the payoff.
    
    measurement:
      type: enum_check
      field: coreMechanic.consistency
      aggregation: direct_check
    
    threshold:
      expected_value: "consistent"
    
    evaluation:
      - if: consistency == "breaking" and not justified_by_concept
        result: FAIL
        severity: WARNING
        message: "Physics rule breaks mid-video without conceptual justification. May confuse viewers."
      
      - if: consistency == "consistent"
        result: PASS
        severity: PASS
        message: "Physics rule remains consistent."

# ========================================
# RULESET METADATA
# ========================================

ruleset_summary:
  total_rules: 11
  blockers: 2
  criticals: 6
  warnings: 3
  
  primary_focus:
    - Static state dominance detection
    - Action and cycle repetition detection
    - Consequence capacity validation
    - Payoff quality checks
  
  derived_from_failures:
    - FAIL_001_KIKO_STATIC_STATE_DOMINANCE
    - FAIL_002_OPA_REPETITIVE_OPEN_CLOSE
    - FAIL_003_ARDA_REPETITIVE_SHARPEN_DRAW

next_version_improvements:
  - Add learned thresholds from performance data
  - Refine cosmetic vs structural escalation detection
  - Add character-specific producibility rules
  - Include platform-specific optimization (IG vs FB)
