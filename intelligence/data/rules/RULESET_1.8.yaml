version: '1.8'
created: '2026-10-14'
extends: RULESET_1.7.yaml
inheritancePolicy: RECURSIVE_V1
returnLoopApplicabilityPolicy: SOURCE_DOMAIN_V1
semanticPolicy: EXISTING_EVIDENCE_ONLY
default_evaluation_stage: PRE_RENDER
description: 'Versioned dispatch correction: complete inherited registry, source-domain
  return-loop applicability, provider-free UNKNOWN semantic evidence. Historical 1.7
  unchanged.'
policy_changes:
- Resolve complete additive ancestry with explicit overrides and cycle validation.
- Multiplication and persistence do not establish autonomous return. Incomplete domain
  evidence remains UNKNOWN.
- Preserve existing profile-admission exclusions for curiosity/adventure and educational
  content.
- Local canonical evaluation never dispatches semantic providers; missing verified
  judgment stays UNKNOWN. No scoring weight/threshold change.
