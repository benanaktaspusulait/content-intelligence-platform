versions:
- changelog: '# Ruleset 1.0 - Initial Release


    ## New Rules (10)

    - CONCEPT_006: Minimum 4 distinct consequences (BLOCKER)

    - BEAT_004: Max 30% single visual state (CRITICAL)

    - REPETITION_002: Action repetition max 2-3x with escalation (CRITICAL)

    - REPETITION_003: Cycle repetition max 2-3x with structural change (CRITICAL)

    - NOVELTY_001: Max 4.5s gap between new consequences (WARNING)

    - PROGRESSION_005: Static pattern max 50% (WARNING→CRITICAL at 65%)

    - ESCALATION_004: Payoff timing at 80%+ (WARNING→CRITICAL)

    - PAYOFF_001: Payoff not repeat of opening (CRITICAL)

    - PRODUCIBILITY_001: Block very_high complexity (BLOCKER)

    - CONSISTENCY_001: Physics rules consistent (WARNING)


    ## Learned From

    - FAIL_001: Kiko static state dominance (42% on mat) → BEAT_004

    - FAIL_002: Opa repetitive open/close 3x → REPETITION_002

    - FAIL_003: Arda repetitive sharpen/draw cycle 3x → REPETITION_003


    ## Philosophy

    Quality Engine enforces three core principles:

    1. **Consequence Density**: Every 15s must deliver 4+ distinct consequences

    2. **Visual Momentum**: No single visual state dominates >30% of timeline

    3. **Escalation**: Intensity builds to payoff, no repetitive loops

    '
  changes:
  - breaking_change: false
    change_type: added
    new_value:
      severity: BLOCKER
      threshold: 4
    old_value: null
    reason: Prevent low-consequence scenarios that fail to engage
    rule_id: CONCEPT_006
  - breaking_change: false
    change_type: added
    new_value:
      severity: CRITICAL
      threshold: 0.3
    old_value: null
    reason: 'Prevent static state dominance (learned from FAIL_001: Kiko 42% on mat)'
    rule_id: BEAT_004
  - breaking_change: false
    change_type: added
    new_value:
      max_repetitions: 3
      severity: CRITICAL
    old_value: null
    reason: 'Prevent action repetition without escalation (learned from FAIL_002:
      Opa open/close 3x)'
    rule_id: REPETITION_002
  - breaking_change: false
    change_type: added
    new_value:
      max_cycles: 3
      severity: CRITICAL
    old_value: null
    reason: 'Prevent cycle repetition (learned from FAIL_003: Arda sharpen/draw/blunt
      3x)'
    rule_id: REPETITION_003
  - breaking_change: false
    change_type: added
    new_value:
      max_gap_seconds: 4.5
      severity: WARNING
    old_value: null
    reason: Maintain novelty distribution across timeline
    rule_id: NOVELTY_001
  - breaking_change: false
    change_type: added
    new_value:
      critical_threshold: 0.65
      static_threshold: 0.5
    old_value: null
    reason: Ensure narrative progression, not static patterns
    rule_id: PROGRESSION_005
  - breaking_change: false
    change_type: added
    new_value:
      min_payoff_position: 0.8
    old_value: null
    reason: Payoff must be at climax (80%+ of timeline)
    rule_id: ESCALATION_004
  - breaking_change: false
    change_type: added
    new_value:
      severity: CRITICAL
    old_value: null
    reason: Payoff cannot be repeat of opening beat
    rule_id: PAYOFF_001
  - breaking_change: false
    change_type: added
    new_value:
      block_complexity: very_high
      severity: BLOCKER
    old_value: null
    reason: Block technically unfeasible prompts before render attempt
    rule_id: PRODUCIBILITY_001
  - breaking_change: false
    change_type: added
    new_value:
      severity: WARNING
    old_value: null
    reason: Flag physics/character inconsistencies for review
    rule_id: CONSISTENCY_001
  deprecated_rules: []
  description: Initial ruleset derived from FAIL_001, FAIL_002, FAIL_003
  is_breaking: false
  learned_from:
  - FAIL_001_KIKO_STATIC_STATE
  - FAIL_002_OPA_REPETITIVE
  - FAIL_003_ARDA_CYCLE
  release_date: '2026-09-14'
  ruleset_path: RULESET_1.0.yaml
  version: '1.0'
- changelog: '# Ruleset 1.1


    Adds 10 rules covering first-frame anomaly, sound independence, dead-air detection,
    active-character ratio, tiered attempt counting, mechanically distinct attempts,
    prop economy, fake resolution, rule-consistent twists, and character continuity
    lock. Supports both short-tier (<=20s) and long-tier (>20s) videos via duration-derived
    thresholds.


    ## New Rules (10)

    - HOOK_002: RULESET 1.1: First Frame Anomaly (hook_strength family)

    - HOOK_003: RULESET 1.1: Sound Independence (hook_strength family)

    - MOTION_001: RULESET 1.1: No Dead Air (motion_quality family)

    - ATTEMPT_001: RULESET 1.1: Attempt Count (concept_strength family)

    - CHAR_002: RULESET 1.1: Active Character (progression family)

    - PRODUCIBILITY_002: RULESET 1.1: Prop Economy (ai_producibility family)

    - PAYOFF_002: RULESET 1.1: Fake Resolution Present (progression family)

    - ATTEMPT_002: RULESET 1.1: Distinct Attempts (visual_novelty family)

    - PAYOFF_003: RULESET 1.1: Rule-Consistent Twist (final_payoff family)

    - CONSISTENCY_002: RULESET 1.1: Character Continuity Lock (consistency family)

    '
  changes:
  - breaking_change: false
    change_type: added
    new_value:
      description: The problem must already be visually obvious within the opening
        second, with no setup, narration, or text explanation required. hook.startsMidAction
        must be true and hook.visualStrength must be at least 4/5.
      family: hook_strength
      id: HOOK_002
      name: First Frame Anomaly
      severity: CRITICAL
      version: '1.1'
    old_value: null
    reason: 'RULESET 1.1: First Frame Anomaly (hook_strength family)'
    rule_id: HOOK_002
  - breaking_change: false
    change_type: added
    new_value:
      description: The core problem and physical comedy must work with audio muted.
        hook.soundOffClear must be true.
      family: hook_strength
      id: HOOK_003
      name: Sound Independence
      severity: CRITICAL
      version: '1.1'
    old_value: null
    reason: 'RULESET 1.1: Sound Independence (hook_strength family)'
    rule_id: HOOK_003
  - breaking_change: false
    change_type: added
    new_value:
      description: No beat may hold with motionAmount == 'none' for longer than 1.5
        seconds.
      family: motion_quality
      id: MOTION_001
      name: No Dead Air
      severity: WARNING
      version: '1.1'
    old_value: null
    reason: 'RULESET 1.1: No Dead Air (motion_quality family)'
    rule_id: MOTION_001
  - breaking_change: false
    change_type: added
    new_value:
      description: 'Count of beats with isAttempt == true must meet a duration-tier
        minimum: 3 for videos <= 20s (short tier), 7 for videos > 20s (long tier).'
      family: concept_strength
      id: ATTEMPT_001
      name: Attempt Count
      severity: BLOCKER
      version: '1.1'
    old_value: null
    reason: 'RULESET 1.1: Attempt Count (concept_strength family)'
    rule_id: ATTEMPT_001
  - breaking_change: false
    change_type: added
    new_value:
      description: The character must spend most of the runtime actively trying a
        solution, not watching or reacting. Ratio of (duration of isAttempt beats)
        / (total duration) must be at least 0.5 for short-tier videos, 0.6 for long-tier.
      family: progression
      id: CHAR_002
      name: Active Character
      severity: CRITICAL
      version: '1.1'
    old_value: null
    reason: 'RULESET 1.1: Active Character (progression family)'
    rule_id: CHAR_002
  - breaking_change: false
    change_type: added
    new_value:
      description: Introduce the minimum number of props necessary. setting.mainProps
        count must not exceed 2 for short-tier videos, 4 for long-tier videos.
      family: ai_producibility
      id: PRODUCIBILITY_002
      name: Prop Economy
      severity: WARNING
      version: '1.1'
    old_value: null
    reason: 'RULESET 1.1: Prop Economy (ai_producibility family)'
    rule_id: PRODUCIBILITY_002
  - breaking_change: false
    change_type: added
    new_value:
      description: 'Bonus (non-blocking): at least one beat with consequenceType ==
        ''fake_win'' before finalPayoff.startsAt, giving the audience a moment to
        believe the problem is solved before the final twist.'
      family: progression
      id: PAYOFF_002
      name: Fake Resolution Present
      severity: WARNING
      version: '1.1'
    old_value: null
    reason: 'RULESET 1.1: Fake Resolution Present (progression family)'
    rule_id: PAYOFF_002
  - breaking_change: false
    change_type: added
    new_value:
      description: Attempts must be mechanically distinct, not just differently worded.
        Identical primaryVerb across attempts is an automatic deterministic FAIL.
        Verb-distinct attempts are checked for semantic duplication via LLM (e.g.
        GRAB vs YANK may be the same underlying strategy). Effective distinct count
        must meet the same duration-tier minimum as ATTEMPT_001.
      family: visual_novelty
      id: ATTEMPT_002
      name: Distinct Attempts
      severity: CRITICAL
      version: '1.1'
    old_value: null
    reason: 'RULESET 1.1: Distinct Attempts (visual_novelty family)'
    rule_id: ATTEMPT_002
  - breaking_change: false
    change_type: added
    new_value:
      description: The final twist must derive from the same established physical
        rule (coreMechanic.physicalRule), applied in a new or bigger way — not an
        unrelated, disconnected joke. Checked via LLM semantic judgment.
      family: final_payoff
      id: PAYOFF_003
      name: Rule-Consistent Twist
      severity: CRITICAL
      version: '1.1'
    old_value: null
    reason: 'RULESET 1.1: Rule-Consistent Twist (final_payoff family)'
    rule_id: PAYOFF_003
  - breaking_change: false
    change_type: added
    new_value:
      description: Character appearance (face, outfit, colors, proportions) must remain
        identical throughout the video, judged by sampling first/middle/last frames
        via vision LLM. This rule requires a rendered video (video_plan_ir['_renderedVideoPath'])
        and reports UNKNOWN at the pure-text concept stage, before any video exists.
      family: consistency
      id: CONSISTENCY_002
      name: Character Continuity Lock
      severity: CRITICAL
      version: '1.1'
    old_value: null
    reason: 'RULESET 1.1: Character Continuity Lock (consistency family)'
    rule_id: CONSISTENCY_002
  description: Adds 10 rules covering first-frame anomaly, sound independence, dead-air
    detection, active-character ratio, tiered attempt counting, mechanically distinct
    attempts, prop economy, fake resolution, rule-consistent twists, and character
    continuity lock. Supports both short-tier (<=20s) and long-tier (>20s) videos
    via duration-derived thresholds.
  is_breaking: false
  learned_from: []
  release_date: '2026-10-02'
  ruleset_path: RULESET_1.1.yaml
  version: '1.1'
- changelog: '# Ruleset 1.2


    Adds 6 rules closing genuine gaps identified by comparing against the ruleset-engine
    Java project: single dominant mechanic (semantically verified, not just author-claimed),
    story-detached gap, final peak intensity, fake-win escalation, dominant action
    ratio, and loopability. Uses RuleOutcome.NOT_APPLICABLE (added in an earlier RULESET
    1.2 commit, distinct from UNKNOWN) for PAYOFF_005''s not-applicable case. All
    new IR fields are optional with backward-compatible defaults; no 1.0/1.1-shaped
    IR is broken by this version.


    ## New Rules (6)

    - CONCEPT_007: RULESET 1.2: Single Dominant Mechanic (concept_strength family)

    - BEAT_005: RULESET 1.2: Story Detached Gap (visual_novelty family)

    - PAYOFF_004: RULESET 1.2: Final Peak Intensity (final_payoff family)

    - PAYOFF_005: RULESET 1.2: Fake Win Escalation (progression family)

    - REPETITION_004: RULESET 1.2: Dominant Action Ratio (visual_novelty family)

    - PAYOFF_006: RULESET 1.2: Loopability (final_payoff family)

    '
  changes:
  - breaking_change: false
    change_type: added
    new_value:
      description: The concept must exhibit exactly one independent physical/magical
        rule. Same mechanic applied with escalating/varied consequences is fine (PASS);
        a second, genuinely independent rule introduced partway through is not (CRITICAL
        at 2 mechanics, BLOCKER at 3+). coreMechanic.mechanicCount is an author claim,
        verified (not trusted) via LLM semantic judgment against the beat-by-beat
        consequences.
      family: concept_strength
      id: CONCEPT_007
      name: Single Dominant Mechanic
      severity: BLOCKER
      version: '1.2'
    old_value: null
    reason: 'RULESET 1.2: Single Dominant Mechanic (concept_strength family)'
    rule_id: CONCEPT_007
  - breaking_change: false
    change_type: added
    new_value:
      description: While the core problem is actively unresolved (at least one attempt
        beat has occurred, final payoff not yet started), no consecutive stretch of
        beats.relatesToCoreProblem == false may exceed 0.5 seconds. Brief transitions/reaction
        beats under that threshold are not flagged; only a genuine abandonment of
        the active problem fails.
      family: visual_novelty
      id: BEAT_005
      name: Story Detached Gap
      severity: CRITICAL
      version: '1.2'
    old_value: null
    reason: 'RULESET 1.2: Story Detached Gap (visual_novelty family)'
    rule_id: BEAT_005
  - breaking_change: false
    change_type: added
    new_value:
      description: The final payoff's beat.intensity should be at least as high as
        the highest intensity seen earlier in the video. Computed independently from
        beat.intensity values; finalPayoff.isPeakIntensity is never trusted as the
        verdict, only cross-checked for discrepancy reporting. Optimization-level
        (WARNING), never a blocker.
      family: final_payoff
      id: PAYOFF_004
      name: Final Peak Intensity
      severity: WARNING
      version: '1.2'
    old_value: null
    reason: 'RULESET 1.2: Final Peak Intensity (final_payoff family)'
    rule_id: PAYOFF_004
  - breaking_change: false
    change_type: added
    new_value:
      description: If a beat with consequenceType == 'fake_win' is present, the intensity
        after it must exceed the intensity at the fake win (the problem must escalate,
        not repeat or weaken, after a fake resolution). Reports NOT_APPLICABLE (not
        FAIL, not UNKNOWN) when no fake-win beat exists — this check simply does not
        apply to a concept that doesn't use the fake-resolution structure.
      family: progression
      id: PAYOFF_005
      name: Fake Win Escalation
      severity: WARNING
      version: '1.2'
    old_value: null
    reason: 'RULESET 1.2: Fake Win Escalation (progression family)'
    rule_id: PAYOFF_005
  - breaking_change: false
    change_type: added
    new_value:
      description: 'Companion to ATTEMPT_002, not a replacement: catches one primaryVerb
        numerically dominating the attempt list even when every attempt is legitimately
        distinct in ATTEMPT_002''s semantic judgment. WARNING above 55% dominance,
        CRITICAL above 70%. Never a BLOCKER, since a dominant verb can be valid if
        it produces genuinely different consequences each time.'
      family: visual_novelty
      id: REPETITION_004
      name: Dominant Action Ratio
      severity: CRITICAL
      version: '1.2'
    old_value: null
    reason: 'RULESET 1.2: Dominant Action Ratio (visual_novelty family)'
    rule_id: REPETITION_004
  - breaking_change: false
    change_type: added
    new_value:
      description: A retention-optimization dimension, never a hard blocker. A strong
        natural loop back to the opening (finalPayoff.loopsToOpening + loopQuality
        == 'strong') is a bonus. An ordinary hard cut with no loop claim is fully
        valid (neutral PASS). Only specific weak-ending text patterns (fade-out, 'the
        end', walks away) with neither a loop nor a hard cut produce a WARNING-severity
        FAIL.
      family: final_payoff
      id: PAYOFF_006
      name: Loopability
      severity: WARNING
      version: '1.2'
    old_value: null
    reason: 'RULESET 1.2: Loopability (final_payoff family)'
    rule_id: PAYOFF_006
  description: 'Adds 6 rules closing genuine gaps identified by comparing against
    the ruleset-engine Java project: single dominant mechanic (semantically verified,
    not just author-claimed), story-detached gap, final peak intensity, fake-win escalation,
    dominant action ratio, and loopability. Uses RuleOutcome.NOT_APPLICABLE (added
    in an earlier RULESET 1.2 commit, distinct from UNKNOWN) for PAYOFF_005''s not-applicable
    case. All new IR fields are optional with backward-compatible defaults; no 1.0/1.1-shaped
    IR is broken by this version.'
  is_breaking: false
  learned_from: []
  release_date: '2026-10-03'
  ruleset_path: RULESET_1.2.yaml
  version: '1.2'
- changelog: '# Ruleset 1.3


    Adds 8 rules closing gaps identified in a session-end review of RULESET 1.2 and
    a real-generation failure analysis: goal-obstruction clarity, rule readability/predictability,
    activity-vs-progression (verb-root repetition), meaningful attempt escalation,
    opening problem legibility, cute emotional readability (new character_performance
    family), mid-tier fragile-interaction AI-production risk, and generation executability
    (new generation_executability family) -- whether semantically-distinct attempts
    will actually render as visually distinct, reliably executable physical actions,
    not just whether they''re conceptually different strategies. Also carries forward
    9 existing-rule semantic corrections applied directly to RULESET_1.2.yaml ahead
    of this generation: MOTION_001 and PAYOFF_004 renamed (logic unchanged), HOOK_002
    gained a 0.8s tolerance window, PRODUCIBILITY_002 gained a timeline-aware mid-concept-prop
    check, ATTEMPT_002''s duplicate-strategy prompt was strengthened for intensity/angle
    variants, and REPETITION_002/003/004 + ATTEMPT_002 gained correlation_group tagging
    for cross-rule-overlap observability. All new IR fields/behavior are additive;
    no 1.0/1.1/1.2-shaped IR is broken by this version.


    ## New Rules (8)

    - GOAL_001: RULESET 1.3: Goal-Obstruction Clarity (concept_strength family)

    - CONCEPT_008: RULESET 1.3: Rule Readability / Predictability (concept_strength
    family)

    - PROGRESSION_006: RULESET 1.3: Activity Is Not Progression (progression family)

    - ESCALATION_005: RULESET 1.3: Meaningful Attempt Escalation (escalation family)

    - HOOK_004: RULESET 1.3: Opening Problem Legibility (hook_strength family)

    - PERFORMANCE_001: RULESET 1.3: Cute Emotional Readability (character_performance
    family)

    - PRODUCIBILITY_003: RULESET 1.3: Fragile Interaction Risk (ai_producibility family)

    - GENERATION_EXECUTABLE_ATTEMPTS: RULESET 1.3: Generation Executable Attempts
    (generation_executability family)

    '
  changes:
  - breaking_change: false
    change_type: added
    new_value:
      description: The character must have an immediately understandable, natural
        physical goal, and the established abnormal rule must genuinely obstruct that
        goal. Distinguishes a believable reason to keep trying from an arbitrary or
        magic-demo setup invented only to showcase the mechanic (the character could
        simply walk away with no believable reason to continue). Verified via LLM
        semantic judgment (check_goal_is_natural), fail-closed to SERVICE_ERROR.
      family: concept_strength
      id: GOAL_001
      name: Goal-Obstruction Clarity
      severity: BLOCKER
      version: '1.3'
    old_value: null
    reason: 'RULESET 1.3: Goal-Obstruction Clarity (concept_strength family)'
    rule_id: GOAL_001
  - breaking_change: false
    change_type: added
    new_value:
      description: 'Distinct from CONCEPT_007: a single, internally consistent mechanic
        is not automatically a legible one. A rule that depends on a combination of
        exact position, angle, and speed is technically one mechanic but unlearnable
        by a child audience watching once. Asks whether a viewer could learn the pattern
        from the first 1-2 occurrences and predict what happens next. Verified via
        LLM semantic judgment (check_rule_is_predictable), fail-closed to SERVICE_ERROR.'
      family: concept_strength
      id: CONCEPT_008
      name: Rule Readability / Predictability
      severity: CRITICAL
      version: '1.3'
    old_value: null
    reason: 'RULESET 1.3: Rule Readability / Predictability (concept_strength family)'
    rule_id: CONCEPT_008
  - breaking_change: false
    change_type: added
    new_value:
      description: 'Deterministic companion to ATTEMPT_002: flags a dominant primaryVerb
        ROOT across attempts (e.g. PUSH / PUSH_HARDER / PUSH_FROM_LEFT all share the
        root PUSH) even when full verb labels are distinct and ATTEMPT_002''s LLM
        duplicate-strategy check already passed. Catches ''more activity, not a new
        strategy'' in the gray area between CHAR_002 (time-active) and ATTEMPT_002
        (label/semantic distinctness). No LLM call.'
      family: progression
      id: PROGRESSION_006
      name: Activity Is Not Progression
      severity: CRITICAL
      version: '1.3'
    old_value: null
    reason: 'RULESET 1.3: Activity Is Not Progression (progression family)'
    rule_id: PROGRESSION_006
  - breaking_change: false
    change_type: added
    new_value:
      description: 'Companion to ESCALATION_004 (payoff timing): checks whether attempt-beat
        intensity rises across the timeline rather than staying flat or declining.
        Deterministic, keyed off beats[].intensity on isAttempt beats in timeline
        order. Capped at WARNING — deadpan-comedy concepts can deliberately keep escalation
        small.'
      family: escalation
      id: ESCALATION_005
      name: Meaningful Attempt Escalation
      severity: WARNING
      version: '1.3'
    old_value: null
    reason: 'RULESET 1.3: Meaningful Attempt Escalation (escalation family)'
    rule_id: ESCALATION_005
  - breaking_change: false
    change_type: added
    new_value:
      description: 'Stricter than HOOK_002: HOOK_002 confirms something visually unusual
        happens immediately; this asks whether the opening ALSO makes clear what the
        character wants and why they can''t get it yet, not just that something odd
        is occurring. Verified via LLM semantic judgment (check_opening_problem_legible),
        fail-closed to SERVICE_ERROR.'
      family: hook_strength
      id: HOOK_004
      name: Opening Problem Legibility
      severity: CRITICAL
      version: '1.3'
    old_value: null
    reason: 'RULESET 1.3: Opening Problem Legibility (hook_strength family)'
    rule_id: HOOK_004
  - breaking_change: false
    change_type: added
    new_value:
      description: New character_performance family (RULESET 1.3). CHAR_002 confirms
        the character is active for enough of the runtime; this asks whether that
        activity reads as emotionally engaged and sympathetic rather than blank, robotic,
        aggressive, or stuck in prolonged panic. Verified via LLM semantic judgment
        (check_character_performance_readable), fail-closed to SERVICE_ERROR. Capped
        at WARNING — a performance-quality nudge, not a structural requirement.
      family: character_performance
      id: PERFORMANCE_001
      name: Cute Emotional Readability
      severity: WARNING
      version: '1.3'
    old_value: null
    reason: 'RULESET 1.3: Cute Emotional Readability (character_performance family)'
    rule_id: PERFORMANCE_001
  - breaking_change: false
    change_type: added
    new_value:
      description: 'Fills the gap between PRODUCIBILITY_001 (very-high-complexity
        hard block) and PRODUCIBILITY_002 (prop count budget): a middle tier of AI-generation
        risks (precision alignment, cloth/rope simulation, liquids, thin dangling
        objects, face/hair contact, multi-object stacking). Uses a tag-based diagnostic
        model (riskTags in evaluation details) rather than one rule per risk type.
        Deterministic substring match against setting.mainProps and beat action/consequence
        text, no LLM call. Always CRITICAL when any tag is found — a human-review
        trigger, not an outright render block.'
      family: ai_producibility
      id: PRODUCIBILITY_003
      name: Fragile Interaction Risk
      severity: CRITICAL
      version: '1.3'
    old_value: null
    reason: 'RULESET 1.3: Fragile Interaction Risk (ai_producibility family)'
    rule_id: PRODUCIBILITY_003
  - breaking_change: false
    change_type: added
    new_value:
      description: 'Distinct from ATTEMPT_002 (semantic strategy diversity): ATTEMPT_002
        asks whether the character is genuinely trying a different strategy; this
        asks whether that different strategy will actually LOOK different and be reliably
        executable by an image-to-video generation model (e.g. Seedance). A deterministic
        keyword pre-filter flags abstract-intent language (''blocks the escape route'',
        ''tries to outsmart'') and vague movement-magnitude phrasing (''slightly moves'')
        on attempt beats, plus a beat-budget estimate (too many attempts for the available
        duration). An LLM semantic check (check_attempts_are_generation_executable)
        judges each attempt for a concrete action-result pair and flags attempts that
        would visually collapse into the same choreography despite different wording.
        BLOCKER only when NO attempt is judged executable at all or the LLM is unreachable
        (SERVICE_ERROR); CRITICAL when some attempts are unexecutable or abstract-intent
        language is matched; WARNING for vague magnitude phrasing or beat-budget pressure
        alone.'
      family: generation_executability
      id: GENERATION_EXECUTABLE_ATTEMPTS
      name: Generation Executable Attempts
      severity: BLOCKER
      version: '1.3'
    old_value: null
    reason: 'RULESET 1.3: Generation Executable Attempts (generation_executability
      family)'
    rule_id: GENERATION_EXECUTABLE_ATTEMPTS
  description: 'Adds 8 rules closing gaps identified in a session-end review of RULESET
    1.2 and a real-generation failure analysis: goal-obstruction clarity, rule readability/predictability,
    activity-vs-progression (verb-root repetition), meaningful attempt escalation,
    opening problem legibility, cute emotional readability (new character_performance
    family), mid-tier fragile-interaction AI-production risk, and generation executability
    (new generation_executability family) -- whether semantically-distinct attempts
    will actually render as visually distinct, reliably executable physical actions,
