services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pompom}
      POSTGRES_USER: ${POSTGRES_USER:-pompom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pompom_local}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pompom} -d ${POSTGRES_DB:-pompom}"]
      interval: 3s
      timeout: 3s
      retries: 20

  ml-service:
    build: ./ml-service
    env_file:
      - ./backend/.env
    environment:
      POMPOM_DATA_ROOT: /data
      POMPOM_SEMANTIC_ENABLED: ${POMPOM_SEMANTIC_ENABLED:-false}
      SEMANTIC_VIDEO_AI_ENABLED: ${SEMANTIC_VIDEO_AI_ENABLED:-false}
      POMPOM_SEMANTIC_PROVIDER: ${POMPOM_SEMANTIC_PROVIDER:-openai}
      OPENAI_VLM_MODEL: ${OPENAI_VLM_MODEL:-gpt-4o}
      OPENAI_SUMMARY_MODEL: ${OPENAI_SUMMARY_MODEL:-gpt-4o}
      SEMANTIC_PRIMARY_MODEL: ${SEMANTIC_PRIMARY_MODEL:-${OPENAI_VLM_MODEL:-gpt-4o-mini}}
      SEMANTIC_FALLBACK_MODEL: ${SEMANTIC_FALLBACK_MODEL:-${OPENAI_VLM_MODEL:-gpt-4o}}
      SEMANTIC_ROUTING_MODE: ${SEMANTIC_ROUTING_MODE:-SINGLE_MODEL}
      SEMANTIC_FALLBACK_ENABLED: ${SEMANTIC_FALLBACK_ENABLED:-false}
      POMPOM_SEMANTIC_TARGET_FRAMES: ${POMPOM_SEMANTIC_TARGET_FRAMES:-8}
      POMPOM_SEMANTIC_MAX_FRAMES: ${POMPOM_SEMANTIC_MAX_FRAMES:-14}
      SEMANTIC_IMAGE_PREPARATION_PROFILE: ${SEMANTIC_IMAGE_PREPARATION_PROFILE:-STANDARD}
      OBSERVATION_BRIDGE_TOKEN: ${OBSERVATION_BRIDGE_TOKEN:-}
      QA_REVIEW_TOKEN: ${QA_REVIEW_TOKEN:-}
    ports: ["8000:8000"]
    volumes:
      - "./data:/data"
      - "${POMPOM_LIBRARY_ROOT:-../../yuvarlak-dunya}:/data/library:ro"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OPENAI_VLM_MODEL: ${OPENAI_VLM_MODEL:-gpt-4o}
      OPENAI_SUMMARY_MODEL: ${OPENAI_SUMMARY_MODEL:-gpt-4o}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pompom}
      DB_USERNAME: ${POSTGRES_USER:-pompom}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pompom_local}
      ML_BASE_URL: http://ml-service:8000
      ML_SERVICE_URL: http://ml-service:8000
      POMPOM_DATA_ROOT: /data
      # Meta read-only analytics (disabled by default). Only read scopes; no publishing vars.
      META_READ_ENABLED: ${META_READ_ENABLED:-false}
      META_API_VERSION: ${META_API_VERSION:-v26.0}
      META_PAGE_ID: ${META_PAGE_ID:-}
      META_INSTAGRAM_ACCOUNT_ID: ${META_INSTAGRAM_ACCOUNT_ID:-}
      # Resolve the read token with nested fallbacks so the backend's primary var is never
      # set-but-empty (Spring treats a set-empty var as a real value, defeating its own fallback).
      META_INSTAGRAM_ACCESS_TOKEN: ${META_INSTAGRAM_ACCESS_TOKEN:-${META_PAGE_ACCESS_TOKEN:-${META_ACCESS_TOKEN:-}}}
      # User token is used only for the read-only pages_show_list management verification (GET /me/accounts).
      META_USER_ACCESS_TOKEN: ${META_USER_ACCESS_TOKEN:-}
      # Meta OAuth authorization flow (read-only scopes only; app secret stays server-side).
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_OAUTH_REDIRECT_URI: ${META_OAUTH_REDIRECT_URI:-}
      RULE_GOVERNANCE_TOKEN: ${RULE_GOVERNANCE_TOKEN:-}
    ports: ["8080:8080"]
    volumes:
      - "./data:/data"
      - "${POMPOM_LIBRARY_ROOT:-../../yuvarlak-dunya}:/data/library:ro"
      - "${POMPOM_SOCIAL_ROOT:-../../yuvarlak-dunya/POMPOM_HILLS_PRODUCTION/09_SOCIAL_REELS/new14092026}:/data/library/POMPOM_HILLS_PRODUCTION/09_SOCIAL_REELS/new14092026"
    depends_on:
      postgres: { condition: service_healthy }
      ml-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20

  creative-render-service:
    build: ./creative-render-service
    environment:
      SPRING_PROFILES_ACTIVE: ${CREATIVE_RENDER_PROFILE:-development}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pompom}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pompom}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pompom_local}
      POMPOM_INTELLIGENCE_BASE_URL: http://backend:8080
      OBSERVATION_BRIDGE_TOKEN: ${OBSERVATION_BRIDGE_TOKEN:-}
      QA_REVIEW_TOKEN: ${QA_REVIEW_TOKEN:-}
      POMPOM_DATA_ROOT: /data
      POMPOM_QA_SERVICE_URL: http://ml-service:8000
      OPENART_ENABLED: ${OPENART_ENABLED:-false}
      OPENART_MOCK_ENABLED: ${OPENART_MOCK_ENABLED:-true}
      OPENART_TOKEN: ${OPENART_TOKEN:-}
      OPENART_CLI_PATH: /usr/local/bin/openart
      OPENART_CLI_TIMEOUT: ${OPENART_CLI_TIMEOUT:-300}
      OPENART_MAX_POLLS: ${OPENART_MAX_POLLS:-180}
      OPENART_MONTHLY_BUDGET: ${OPENART_MONTHLY_BUDGET:-1000}
      OPENART_WARNING_THRESHOLD: ${OPENART_WARNING_THRESHOLD:-0.2}
      OPENART_ALERT_ENABLED: ${OPENART_ALERT_ENABLED:-true}
    expose: ["8081"]
    volumes:
      - "./data:/data"
      - "${POMPOM_LIBRARY_ROOT:-../../yuvarlak-dunya}:/data/library:ro"
      # Run `openart login` on the host first. The CLI stores OAuth credentials here.
      - "${OPENART_CREDENTIALS_DIR:-~/.openart}:/root/.openart"
    depends_on:
      postgres: { condition: service_healthy }
      backend: { condition: service_healthy }
      ml-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20

  frontend:
    build: ./frontend
    ports: ["4200:80"]
    depends_on:
      backend: { condition: service_healthy }
      creative-render-service: { condition: service_healthy }

volumes:
  postgres-data:
