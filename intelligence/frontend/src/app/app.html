<div class="app-frame">
  <header class="mobile-header">
    <a class="brand brand--mobile" routerLink="/overview" aria-label="Pompom Creative Intelligence home">
      <span class="brand-mark">P</span>
      <span>Creative Intelligence</span>
    </a>
    <button class="icon-button mobile-menu" type="button" aria-label="Toggle navigation" (click)="navOpen.update(value => !value)">
      <span aria-hidden="true">{{ navOpen() ? '×' : '☰' }}</span>
    </button>
  </header>

  <aside class="sidebar" [class.sidebar--open]="navOpen()">
    <a class="brand" routerLink="/overview" aria-label="Pompom Creative Intelligence home">
      <span class="brand-mark">P</span>
      <span class="brand-copy"><strong>Pompom</strong><small>Creative Intelligence</small></span>
    </a>

    <div class="rail-label">WORKSPACE</div>
    <nav class="primary-nav" aria-label="Primary navigation">
      @for (item of navigation; track item.route) {
        <a [routerLink]="item.route" routerLinkActive="is-active" (click)="closeNavigation()">
          <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <footer class="rail-footer">
      <div class="status-light" aria-hidden="true"></div>
      <span><strong>Local workspace</strong><small>Persisted evidence only</small></span>
    </footer>
  </aside>

  @if (navOpen()) {
    <button class="nav-scrim" type="button" aria-label="Close navigation" (click)="closeNavigation()"></button>
  }

  <main class="workspace">
    <router-outlet />
  </main>
</div>
