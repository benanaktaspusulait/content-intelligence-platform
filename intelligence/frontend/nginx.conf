server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Read-only human-review data is available to the Angular application through the
  # same gateway, while review decisions remain internal to the render service.
  location = /api/v1/qa/reviews/pending {
    limit_except GET { deny all; }
    proxy_pass http://creative-render-service:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/api/v1/qa/reviews/[0-9a-fA-F-]+/history$ {
    limit_except GET { deny all; }
    proxy_pass http://creative-render-service:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/v1/render-jobs {
    proxy_pass http://creative-render-service:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Render-owned operational and publication APIs must stay on the render-service side of the
  # gateway. The intelligence backend owns /api/v1/performance, /api/v1/intelligence, and
  # governance routes; sending these paths through the generic /api/ fallback makes the UI look
  # empty even though the render service has the records.
  location ~ ^/api/v1/(publications|scheduled|captions|budget|notifications|operational|render-assets|sse|qa)(/|$) {
    proxy_pass http://creative-render-service:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
