server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The HTML shell must always point to the newest hashed Angular bundle after a deploy.
  # Bundled assets remain cacheable because their filenames are content-hashed.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  # Read-only human-review data is available to the Angular application through the
  # same gateway, while review decisions remain internal to the render service.
  location = /api/v1/qa/reviews/pending {
    limit_except GET { deny all; }
    proxy_pass http://creative-render-service:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/api/v1/qa/reviews/[0-9a-fA-F-]+/history$ {
    limit_except GET { deny all; }
    proxy_pass http://creative-render-service:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/v1/render-jobs {
    proxy_pass http://creative-render-service:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Render-owned operational and publication APIs must stay on the render-service side of the
  # gateway. The intelligence backend owns /api/v1/performance, /api/v1/intelligence, and
  # governance routes; sending these paths through the generic /api/ fallback makes the UI look
  # empty even though the render service has the records.
  location ~ ^/api/v1/(publications|scheduled|captions|budget|notifications|operational|render-assets|openart|sse|qa)(/|$) {
    proxy_pass http://creative-render-service:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Quality validation may perform several bounded semantic provider calls.
    # Keep the gateway alive until the backend's 180-second request limit wins.
    proxy_read_timeout 190s;
    proxy_send_timeout 190s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
