spring:
  application:
    name: pompom-creative-render-service
  # The render service owns an isolated `creative_render` schema with its own Flyway history,
  # physically separate from the backend-owned `public` schema (historical V1-V28). Flyway creates
  # and manages only this schema; Hibernate never issues DDL (ddl-auto=none) and resolves all
  # entities against `creative_render`.
  flyway:
    enabled: true
    create-schemas: true
    default-schema: creative_render
    schemas: creative_render
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: creative_render
  datasource:
    hikari:
      schema: creative_render
  # Required for EmailNotificationService's JavaMailSender bean to be autoconfigured. Without a
  # host, Spring Boot's mail autoconfiguration backs off and the application fails to start
  # (ProductionMailAutoConfigurationTest pins this). Email sending itself stays opt-in via
  # pompom.notifications.email.enabled (default false), so an unreachable/placeholder SMTP host
  # never blocks boot or gets contacted unless notifications are explicitly turned on.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
server:
  port: ${SERVER_PORT:8081}

management:
  health:
    mail:
      enabled: false

pompom:
  intelligence-base-url: ${POMPOM_INTELLIGENCE_BASE_URL:http://localhost:8080}
  library:
    root: ${POMPOM_LIBRARY_ROOT:/data/library}
  observation-bridge-token: ${OBSERVATION_BRIDGE_TOKEN:}
  qa:
    review-token: ${QA_REVIEW_TOKEN:}
  render:
    worker:
      enabled: ${RENDER_WORKER_ENABLED:true}
      lease-duration: ${RENDER_WORKER_LEASE_DURATION:10m}
      batch-size: ${RENDER_WORKER_BATCH_SIZE:10}
      tick-interval: ${RENDER_WORKER_TICK_INTERVAL:5s}
    upscale:
      enabled: ${POMPOM_UPSCALE_ENABLED:true}
      script: ${POMPOM_UPSCALE_SCRIPT:tools/upscale.sh}
      target-resolution: ${POMPOM_UPSCALE_TARGET_RESOLUTION:1920x1080}
      timeout-seconds: ${POMPOM_UPSCALE_TIMEOUT:900}
  webhooks:
    meta-signature-required: ${META_WEBHOOK_SIGNATURE_REQUIRED:true}
  meta:
    publish-enabled: ${META_PUBLISH_ENABLED:false}
    comment-reply-enabled: ${META_COMMENT_REPLY_ENABLED:false}
  publishers:
    meta-base-url: ${META_PUBLISHER_BASE_URL:http://meta-publisher-service:8082}
    tiktok-base-url: ${TIKTOK_PUBLISHER_BASE_URL:http://tiktok-publisher-service:8083}
    youtube-base-url: ${YOUTUBE_PUBLISHER_BASE_URL:http://youtube-publisher-service:8084}
    meta-internal-token: ${META_PUBLISHER_INTERNAL_TOKEN:}
    tiktok-internal-token: ${TIKTOK_PUBLISHER_INTERNAL_TOKEN:}
    youtube-internal-token: ${YOUTUBE_PUBLISHER_INTERNAL_TOKEN:}
    meta-enabled: ${META_PUBLISHER_CLIENT_ENABLED:false}
    tiktok-enabled: ${TIKTOK_PUBLISHER_CLIENT_ENABLED:false}
    youtube-enabled: ${YOUTUBE_PUBLISHER_CLIENT_ENABLED:false}
  openart:
    enabled: ${OPENART_ENABLED:false}
    mock:
      enabled: ${OPENART_MOCK_ENABLED:true}
    token: ${OPENART_TOKEN:}
    cli:
      path: ${OPENART_CLI_PATH:openart}
      timeout-seconds: ${OPENART_CLI_TIMEOUT:300}
    max-polls: ${OPENART_MAX_POLLS:180}
    budget:
      monthly: ${OPENART_MONTHLY_BUDGET:1000}
      warning-threshold: ${OPENART_WARNING_THRESHOLD:0.2}
      alert:
        enabled: ${OPENART_ALERT_ENABLED:true}
        webhook-url: ${OPENART_ALERT_WEBHOOK_URL:}
        email: ${OPENART_ALERT_EMAIL:}
    cost:
      first-frame: ${OPENART_FIRST_FRAME_COST:10}
      video: ${OPENART_VIDEO_COST:100}
