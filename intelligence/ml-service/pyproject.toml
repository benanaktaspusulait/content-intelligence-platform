[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pompom-creative-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.11,<5",
  "scikit-learn>=1.7,<2",
  "openai>=1.0.0",
  "anthropic>=0.25.0",
  "google-generativeai>=0.3.0",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<9", "ruff>=0.12,<1", "mypy>=1.17,<2", "types-PyYAML>=6.0,<7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

