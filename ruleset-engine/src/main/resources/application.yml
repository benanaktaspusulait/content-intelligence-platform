spring:
  application:
    name: pompom-ruleset-engine
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pompom_ruleset}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
  
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api/ruleset/v1

# OpenAI configuration
openai:
  api-key: ${OPENAI_API_KEY}
  model: ${OPENAI_MODEL:gpt-4-turbo-preview}
  temperature: ${OPENAI_TEMPERATURE:0.3}
  max-tokens: ${OPENAI_MAX_TOKENS:1000}

# Rule engine configuration
ruleset:
  evaluation:
    # Timeout for LLM-based evaluations (milliseconds)
    llm-timeout-ms: 30000
    # Timeout for code-based evaluations (milliseconds)
    code-timeout-ms: 5000
    # Enable parallel rule evaluation
    parallel-evaluation: true
    # Max concurrent LLM calls
    max-concurrent-llm: 3
  
  learning:
    # Minimum sample size for correlation detection
    min-sample-size: 10
    # Correlation threshold for candidate rule generation
    correlation-threshold: 0.6
    # P-value threshold for statistical significance
    p-value-threshold: 0.05
    # Auto-activate rules (NEVER true in production)
    auto-activate-rules: false
  
  performance:
    # Platform-specific configuration
    meta-facebook:
      entry-proxy-danger: 0.60
      entry-proxy-viable: 0.75
      entry-proxy-strong: 0.80
      avg-watch-ratio-good: 0.90
      avg-watch-ratio-replay: 1.00
      end-retention-weak: 0.45
      end-retention-healthy: 0.55
      end-retention-strong: 0.60
    
    tiktok:
      drop-point-warning-critical: false

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

# Logging
logging:
  level:
    root: INFO
    com.pompom.ruleset: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
