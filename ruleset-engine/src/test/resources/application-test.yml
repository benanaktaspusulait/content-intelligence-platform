spring:
  datasource:
    url: jdbc:tc:postgresql:15:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  
  liquibase:
    enabled: true

openai:
  api-key: test-key
  model: gpt-4-turbo-preview
  temperature: 0.3
  max-tokens: 1000
